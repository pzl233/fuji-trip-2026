<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="theme-color" content="#176764">
  <title>日本行程地图 · 2026/11/26–12/10</title>
  <meta name="description" content="富士山自驾、东京、大阪、神户和京都的15天行程地图，包含预订状态、待定安排、每日交通、住宿和Google Maps导航。">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="trip-style.css?v=20261108">
  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script defer src="trip-data.js?v=20261108"></script>
  <script defer src="trip-app.js?v=20261108"></script>
</head>
<body>
  <a class="skip-link" href="#content">跳到行程内容</a>
  <div class="layout">
    <aside class="map-panel" aria-label="行程地图">
      <div id="map" role="region" aria-label="每天的地点与停靠顺序"></div>
      <div class="map-actions">
        <button id="locate-button" class="btn secondary" type="button">我的位置</button>
        <button id="map-toggle-button" class="btn secondary" type="button" aria-expanded="true">收起地图</button>
      </div>
      <p id="map-status" class="map-status" role="status" aria-live="polite">正在载入地图；行程和导航链接可独立使用。</p>
    </aside>
    <main class="plan-panel">
      <header class="topbar">
        <a class="brand" href="#section=summary" aria-label="返回日本行程总结">JAPAN / 2026</a>
        <button id="print-button" class="btn secondary" type="button">打印行程</button>
      </header>
      <nav id="section-nav" class="section-nav" aria-label="行程区域"></nav>
      <nav id="day-tabs" class="day-tabs" aria-label="选择日期"></nav>
      <div id="content" class="content" aria-label="行程内容">
        <h1 id="plan-heading">日本行程地图</h1>
        <p>正在整理完整行程。所有时间均为日本当地时间。</p>
      </div>
      <noscript><p>请开启JavaScript查看地图与每日行程。也可以查看<a href="itinerary.md">文字版行程</a>。</p></noscript>
    </main>
  </div>
</body>
</html>
